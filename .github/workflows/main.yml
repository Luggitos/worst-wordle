name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./mvnw -B verify

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  pr-status-check:
    name: PR Status Check
    needs: [backend, frontend, changes]
    if: always() 
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: | 
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
              echo "::error::changes job finished with $CHANGES_RESULT"
              exit 1
          fi

          case "${BACKEND_CHANGED}:${BACKEND_RESULT}" in
            true:success|false:skipped) ;;
            *)
             echo "::error:: unexpected backend state: changed=$BACKEND_CHANGED result=$BACKEND_RESULT"
             exit 1
             ;;
          esac
        
          case "${FRONTEND_CHANGED}:${FRONTEND_RESULT}" in
            true:success|false:skipped) ;;
            *)
             echo "::error:: unexpected frontend state: changed=$FRONTEND_CHANGED result=$FRONTEND_RESULT"
             exit 1
             ;;
          esac

          echo "All jobs have passed."


