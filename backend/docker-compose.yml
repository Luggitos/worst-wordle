version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: wordle-postgres
    restart: always
    environment:
      POSTGRES_DB: Wordle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: