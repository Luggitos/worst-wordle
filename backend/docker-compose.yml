version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine
    container_name: wordle-postgres
    restart: always
    environment:
      POSTGRES_DB: Wordle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordle-backend
    restart: unless-stopped
    depends_on:
      - postgres-db
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/Wordle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: pass1234

volumes:
  postgres_data: